name: Build HnBee Music Desktop (.exe)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v2.5.0)"
        required: false
        default: "v2.5.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure desktop icon asset is synced
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/assets | Out-Null
          Copy-Item -Path public/icon.png -Destination desktop/assets/icon.png -Force

      - name: Install Desktop Electron dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows Installer & Portable (.exe)
        working-directory: desktop
        run: npm run build:win

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HnBee-Music-Windows-x64
          path: |
            desktop/dist/HnBee-Music-Setup.exe
            desktop/dist/HnBee-Music-Portable.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v2.5.0' }}
          name: "HnBee Music ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v2.5.0' }} (Windows .exe)"
          body: |
            ## HnBee Music Desktop cho Windows 10/11 (64-bit)
            - **HnBee-Music-Setup.exe**: Bộ cài đặt chuẩn có tạo lối tắt Desktop & Start Menu.
            - **HnBee-Music-Portable.exe**: Bản chạy ngay không cần cài đặt.
            - Hỗ trợ **System Tray** chạy nền khi bấm dấu X, **phím tắt Media vật lý** trên bàn phím và **tự động phát nhạc không bị chặn Autoplay**.
          files: |
            desktop/dist/HnBee-Music-Setup.exe
            desktop/dist/HnBee-Music-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
